name: Stash Weekly Review

# 창고봇(@sta26bot) 주간 창고 리뷰 — 월요일 아침 텔레그램으로.
# 실제 일은 Supabase 함수 stash-bot 이 한다 (이 워크플로는 「지금 보내」 신호만).
# GitHub 예약은 몇 시간씩 밀릴 수 있음 — 사장님이 그 정도는 괜찮다고 함 (2026-11-12).
# 코드: cld/stash (비공개 cld-hub)
on:
  schedule:
    - cron: "7 0 * * 1"   # 월요일 09:07 KST. 주간 트렌딩(09:17)과 조금 비켜서
  workflow_dispatch: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask stash-bot to send the weekly review
        env:
          STASH_CRON_SECRET: ${{ secrets.STASH_CRON_SECRET }}
        run: |
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 150 \
            -X POST 'https://mywqptmbwdxzolwfebdf.supabase.co/functions/v1/stash-bot?cron=weekly' \
            -H 'content-type: application/json' \
            -H "x-cron-secret: ${STASH_CRON_SECRET}" \
            -d '{}')
          echo "HTTP $code"; cat resp.json; echo
          test "$code" = "200"

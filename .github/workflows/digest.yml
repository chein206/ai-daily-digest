name: AI Daily Digest

on:
  schedule:
    # 매일 한국시간 07:47 (UTC 22:47 전날) — 정시(:00)는 GitHub 러너 러시아워라 지연 심함.
    # 어중간한 분으로 두면 대기열 경쟁이 적어 실제 도착이 8시 전후로 안정됨.
    - cron: "47 22 * * *"
  workflow_dispatch: {}   # GitHub 웹/CLI에서 수동 실행용

permissions:
  contents: write   # 피드백/발송 로그를 저장소에 커밋하기 위해

concurrency:
  group: era-bot-telegram   # 폴링 워크플로와 같은 그룹 — getUpdates 동시 실행 방지
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
        run: python digest.py

      - name: Commit feedback & digest log
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "chore: digest log & feedback ($(date -u +%F))"
          git pull --rebase --autostash || true
          git push || true

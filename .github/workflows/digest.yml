name: AI Daily Digest

on:
  schedule:
    # 매일 한국시간 08:00 (UTC 23:00 전날) — 시간 바꾸려면 이 cron만 수정
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # GitHub 웹/CLI에서 수동 실행용

permissions:
  contents: write   # 피드백/발송 로그를 저장소에 커밋하기 위해

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
        run: python digest.py

      - name: Commit feedback & digest log
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "chore: digest log & feedback ($(date -u +%F))"
          git push || true

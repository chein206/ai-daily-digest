name: AI Daily Digest

on:
  schedule:
    # 매일 한국시간 07:47 (UTC 22:47 전날) — 정시(:00)는 GitHub 러너 러시아워라 지연 심함.
    # 어중간한 분으로 두면 대기열 경쟁이 적어 실제 도착이 8시 전후로 안정됨.
    - cron: "47 22 * * *"
  workflow_dispatch:      # GitHub 웹/CLI에서 수동 실행용
    inputs:
      model:
        description: "모델 (비우면 기본값)"
        required: false
        default: ""
      compare:
        description: "모델 비교 실행 — 발송 이력 제외를 끄고 로그도 남기지 않는다"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 피드백/발송 로그를 저장소에 커밋하기 위해

concurrency:
  group: era-bot-telegram   # 폴링 워크플로와 같은 그룹 — getUpdates 동시 실행 방지
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          # 이 프로젝트 전용 키. SCPAD·edu와 키를 공유하면 여기서 크레딧을 다 쓸 때
          # 제품 AI 기능(명함 OCR·메시지 생성)까지 같이 멈춘다 (2026-09-17 실제 발생).
          # DIGEST_ANTHROPIC_API_KEY 시크릿을 등록하면 그 키만 쓰고, 없으면 아래 공용 키로 폴백.
          DIGEST_ANTHROPIC_API_KEY: ${{ secrets.DIGEST_ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 2026-09-17 sonnet-5 → haiku-4-5. 같은 후보 풀로 대조한 결과 선별·요약 품질 차이가
          # 체감되지 않았고, 소요도 2m4s → 41s로 짧아졌다. 되돌리려면 이 값만 바꾸면 된다.
          CLAUDE_MODEL: ${{ inputs.model || 'claude-haiku-4-5' }}
        run: python digest.py ${{ inputs.compare && '--compare' || '' }}

      - name: Commit feedback & digest log
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "chore: digest log & feedback ($(date -u +%F))"
          git pull --rebase --autostash || true
          git push || true

name: Weekly GitHub Trending

# 매주 월요일 아침, GitHub에서 이번 주 스타를 가장 많이 받은 저장소 TOP 10.
# Claude 호출은 한글 요약 1회뿐 (Haiku 5.5 · effort low).
on:
  schedule:
    - cron: "17 0 * * 1"   # 월요일 09:17 KST (월요일 00:17 UTC). 매일 다이제스트(07:47 KST)와 안 겹치게
  workflow_dispatch: {}

permissions:
  contents: write   # trending_log.jsonl · usage_log.jsonl 을 커밋하기 위해

concurrency:
  group: era-bot-telegram   # 다이제스트·폴링과 같은 그룹 — data/ 커밋이 엇갈리지 않게
  cancel-in-progress: false

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly trending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          DIGEST_ANTHROPIC_API_KEY: ${{ secrets.DIGEST_ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # README 조회 한도 60 → 1000회/시간
        run: python trending.py

      - name: Commit trending log
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly trending ($(date -u +%F))"
          git pull --rebase --autostash || true
          git push || true
